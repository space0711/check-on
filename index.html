{id:'b5',title:'별을 수선하는 사람',author:'제이 문',genre:'SF',price:160,color:['#1b1f4a','#6a5acd'],orn:'⭐',tags:['SF','우주','별','상상','위로','따뜻'],blurb:'2291년 은하 외곽, 꺼져 가는 별을 고치는 수선공 하람의 하루.',
 pages:['2291년, 은하 외곽의 수선소에는 꺼져 가는 별들이 맡겨진다. 수선공 하람은 별의 심장 소리를 듣는 청진기를 귀에 꽂았다. 오늘의 별은 너무 오래 혼자 빛나 지쳐 있었다.','"빛을 더 넣어 줄 수는 없어요." 하람이 말했다. "대신 옆에 작은 별 하나를 붙여 줄게요. 서로를 비추면 덜 지치거든요."','그날 밤 관측소의 아이들은 새로운 쌍성을 발견했다고 들떠 있었다. 하람은 공구를 정리하며 웃었다. 우주에서 가장 오래가는 수리법은 늘 함께 있게 하는 것이었다.']},
{id:'b6',title:'여름, 그리고 레모네이드',author:'서다정',genre:'로맨스',price:130,color:['#f2c94c','#ff9f80'],orn:'🍋',tags:['설렘','로맨스','여름','청춘','사랑','바다'],blurb:'칠월에만 열리는 바닷가 레모네이드 가판대에서 시작된 서른한 잔의 여름.',
 pages:['바닷가 마을의 레모네이드 가판대는 매년 칠월에만 열렸다. 올해 가판대를 지키는 사람은 할머니가 아니라, 처음 보는 손녀였다.','"레몬이 너무 셔요." 내가 말하자 그녀가 진지하게 설탕을 한 숟갈 더 넣었다. "그럼 내일 또 와서 말해 줘요. 맞는 맛을 찾을 때까지."','그 여름 나는 서른한 잔의 레모네이드를 마셨다. 마지막 잔은 정말이지 완벽했고, 우리는 그 사실을 둘 다 모르는 척했다.']},
{id:'b7',title:'잃어버린 지도의 섬',author:'마루',genre:'모험',price:140,color:['#1f6f78','#e0c48a'],orn:'🧭',tags:['모험','바다','탐험','용기','멀리','성장'],blurb:'어느 바다에도 없는 섬이 그려진 지도. 그 섬은 길을 잃어야만 보인다.',
 pages:['할아버지의 낡은 트렁크 바닥에서 지도 한 장이 나왔다. 섬의 모양은 그려져 있는데, 어느 바다에도 그런 섬은 없었다.','지도 뒷면에는 연필로 쓴 글씨가 있었다. "보이지 않는 섬은 길을 잃은 사람에게만 보인다." 열두 살의 도하는 그날 처음으로 일부러 길을 잃어 보기로 했다.','안개 낀 아침, 낡은 보트 위에서 나침반 바늘이 빙글빙글 돌기 시작했다. 그리고 안개 너머로, 지도와 똑같은 모양의 해안선이 천천히 떠올랐다.']},
{id:'b8',title:'도서관에서 사라진 문장',author:'김반장',genre:'추리',price:120,color:['#4a2c2a','#c9a24a'],orn:'🔍',tags:['추리','도서관','두뇌','미스터리','책','긴장'],blurb:'매일 한 문장씩 사라지는 책들. 이어 붙이면 누군가의 편지가 된다.',
 pages:['시립 도서관의 소설 한 권에서 문장 하나가 사라졌다. 찢긴 자국도, 지운 흔적도 없었다. 다만 312쪽 셋째 줄이 하얗게 비어 있을 뿐이었다.','다음 날엔 다른 책에서, 그다음 날엔 또 다른 책에서 문장이 사라졌다. 사서 보조 민재는 사라진 문장들을 모아 노트에 적어 보았다. 그것들은 이어 붙이면 하나의 편지가 되었다.','"이 도서관 어딘가에 내가 있어요. 나를 끝까지 읽어 주세요." 민재는 노트를 덮고 서고의 불을 켰다. 누군가 아주 오래 기다리고 있었다.']},
{id:'b9',title:'느리게 걷는 법',author:'이온',genre:'에세이',price:80,color:['#7aa37a','#e9efd8'],orn:'🌼',tags:['위로','힐링','산책','에세이','일상','잔잔','쉼'],blurb:'빨리 걷는 사람은 목적지를, 느리게 걷는 사람은 길을 본다.',
 pages:['빨리 걷는 사람은 목적지를 보고, 느리게 걷는 사람은 길을 본다. 나는 요즘 후자가 되는 연습을 한다. 보도블록 틈에 핀 민들레의 이름을 불러 주는 연습.','느리게 걸으면 계절이 바뀌는 순서가 보인다. 벚꽃이 먼저인지 목련이 먼저인지, 매미가 언제 처음 우는지. 그건 바쁠 때는 절대 알 수 없는 정보다.','오늘도 약속 시간에 조금 늦었다. 미안하다고 말하며 오는 길에 본 고양이 이야기를 했다. 친구는 웃었고, 우리는 조금 더 오래 앉아 있었다.']},
{id:'b10',title:'궤도 위의 정원',author:'노을',genre:'SF',price:170,color:['#0f3b3a','#5fd0a0'],orn:'🪴',tags:['SF','우주','식물','상상','모험','로봇','감동'],blurb:'모두가 떠난 우주 정거장에 홀로 남은 정원사 로봇 T-7.',
 pages:['우주 정거장 "푸른 고리"에는 사람보다 식물이 더 많았다. 정원사 로봇 T-7은 매일 아침 토마토 잎에 말을 걸었다. 기록에 따르면 대화는 성장률을 4퍼센트 높였다.','어느 날 정거장의 전력이 끊겼다. 사람들은 대피선에 올랐지만 T-7은 남았다. "정원은 혼자 두면 시들어요." 그것이 T-7이 남긴 마지막 통신이었다.','석 달 뒤 구조대가 도착했을 때, 정거장은 초록빛으로 가득 차 있었다. 창문마다 덩굴이 별빛을 향해 뻗어 있었고, 그 한가운데에 T-7이 앉아 조용히 노래하고 있었다.']},
{id:'b11',title:'숲의 말을 배우다',author:'도토리',genre:'동화',price:60,color:['#4f7a3a','#d8c07a'],orn:'🍂',tags:['동화','숲','동물','자연','위로','잔잔','짧은'],blurb:'숲으로 이사 온 소녀 나무가 숲의 언어를 하나씩 받아 적는 이야기.',
 pages:['숲에 이사 온 첫날, 소녀 나무는 아무와도 말이 통하지 않았다. 다람쥐는 재잘거리고, 부엉이는 웅얼거리고, 바람은 그냥 휘파람만 불었다.','나무는 공책을 꺼내 들리는 소리를 하나씩 받아 적었다. "쪼르르"는 반갑다는 뜻, "부우"는 조심하라는 뜻. 숲의 말은 생각보다 다정한 말이 많았다.','가을이 되자 나무는 처음으로 숲에게 대답했다. 낙엽을 밟으며 "바스락"이라고. 그건 숲의 말로 "나 여기 있어"라는 뜻이었다.']},
{id:'b12',title:'편지가 늦게 도착하는 마을',author:'한여름',genre:'로맨스',price:110,color:['#a05070','#f5c6d6'],orn:'💌',tags:['로맨스','편지','위로','설렘','힐링','사랑','따뜻'],blurb:'모든 편지가 정확히 일 년 늦게 도착하는 마을의 사랑법.',
 pages:['그 마을에서는 모든 편지가 정확히 일 년 늦게 도착한다. 그래서 사람들은 편지를 쓸 때 늘 일 년 뒤의 상대를 상상하며 쓴다.','나는 작년의 그에게서 편지를 받았다. "내년의 너는 아마 지금보다 조금 덜 울고 있겠지." 맞는 말이었다. 나는 웃으며 일 년 뒤의 그에게 답장을 썼다.','"내년의 너도 여전히 이 편지를 기다려 주면 좋겠어." 우체통에 편지를 넣고 돌아서는데, 마을의 시계탑이 정각을 알렸다. 일 년은 생각보다 금방 올 것 같았다.']}];

const Snd={ctx:null,master:null,cur:null,name:null,on:true,vol:.6,

 build(name){const c=this.ctx,out=c.createGain();out.gain.value=0;out.connect(this.master);const srcs=[],ivs=[];const loop=(fn,min,max)=>{const h={alive:true};const tick=()=>{if(!h.alive)return;fn();h.t=setTimeout(tick,min+Math.random()*(max-min))};h.t=setTimeout(tick,min);ivs.push(h)};
  const parts=name==='rainfire'?['rain','fire']:[name];
  for(const p of parts){
   if(p==='rain'){const s=this.src('pink'),h=this.filt('highpass',500),l=this.filt('lowpass',7000),g=c.createGain();g.gain.value=.9;s.connect(h);h.connect(l);l.connect(g);g.connect(out);srcs.push(s);loop(()=>this.burst(out,.04,2500+Math.random()*3500,.18),30,140)}
   if(p==='fire'){const s=this.src('brown'),l=this.filt('lowpass',500),g=c.createGain();g.gain.value=.8;s.connect(l);l.connect(g);g.connect(out);srcs.push(s);loop(()=>this.burst(out,.015+Math.random()*.03,1500+Math.random()*3000,.25+Math.random()*.4,'highpass'),60,420)}

   if(p==='forest'){const s=this.src('brown'),l=this.filt('lowpass',380),g=c.createGain();g.gain.value=.5;s.connect(l);l.connect(g);g.connect(out);srcs.push(s);loop(()=>{const n=2+Math.random()*3|0,base=2400+Math.random()*1600;for(let i=0;i<n;i++)setTimeout(()=>{if(!this.ctx)return;const o=this.tone(out,base,.09,.05);o.frequency.setValueAtTime(base,c.currentTime);o.frequency.exponentialRampToValueAtTime(base*1.4,c.currentTime+.07)},i*120)},1500,5000)}
   if(p==='sky'){const s=this.src('pink'),b=this.filt('bandpass',450,.6),g=c.createGain();g.gain.value=.5;const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.12;lg.gain.value=.3;lfo.connect(lg);lg.connect(g.gain);lfo.start();srcs.push(lfo);s.connect(b);b.connect(g);g.connect(out);srcs.push(s);const pent=[1046,1175,1318,1568,1760,2093];loop(()=>this.tone(out,pent[Math.random()*pent.length|0],2.6,.04),2500,6000)}

 const sv=$('#phSave');if(sv)sv.onclick=async()=>{const bs=atob(url.split(',')[1]),ua=new Uint8Array(bs.length);for(let i=0;i<bs.length;i++)ua[i]=bs.charCodeAt(i);const blob=new Blob([ua],{type:'image/jpeg'});let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}

  else{const a=document.createElement('a');a.href=url;a.download='책크온_'+PSPOTS[photoSpot].f+'.jpg';document.body.appendChild(a);a.click();a.remove()}};

function pwLock(code,ok){let v='';openModal(`<header><h3>🔒 숫자 자물쇠</h3><button class="x" data-close>✕</button></header><div class="pwBox"><div style="font-size:14px">비밀번호 세 자리를 눌러 주세요</div><div class="pwDots"><span></span><span></span><span></span></div><div class="pwMsg"></div><div class="pwPad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div></div>`,'pw');
 const box=$('#modal .pwBox'),dots=[...box.querySelectorAll('.pwDots span')],msg=box.querySelector('.pwMsg');
 const draw=()=>dots.forEach((d,i)=>d.textContent=v[i]?'●':'');
 const check=()=>{if(v===code){closeModal();ok()}else{msg.textContent='찰칵… 비밀번호가 맞지 않아요';box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');v='';draw()}};
 const press=k=>{if(k==='⌫'){v=v.slice(0,-1);msg.textContent=''}else if(k==='✓'){if(v.length===3)check()}else if(v.length<3){v+=k;msg.textContent='';if(v.length===3){draw();setTimeout(check,180);return}}draw()};
 box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));
